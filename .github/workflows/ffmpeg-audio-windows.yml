name: Build portable audio FFmpeg

on:
  push:
    branches: [codex/ffmpeg-audio-build]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-audio:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Fetch pinned official source
        shell: pwsh
        run: python tools/ffmpeg-build/fetch_sources.py
      - name: Set up MINGW64 build tools
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            make diffutils tar xz gnupg
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-nasm
            mingw-w64-x86_64-pkgconf
      - name: Build audio-only LGPL FFmpeg with Schannel
        shell: msys2 {0}
        run: bash tools/ffmpeg-build/build.sh
      - name: Install certificate test tooling
        shell: pwsh
        run: python -m pip install --disable-pip-version-check cryptography==46.0.3
      - name: Verify audio and HTTPS on the disposable runner
        shell: pwsh
        run: python tools/ffmpeg-build/verify.py --tls-ci
      - name: Package binary and corresponding source together
        shell: pwsh
        run: python tools/ffmpeg-build/package.py
      - name: Keep matched release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ffmpeg-8.1.2-hdusign-audio-win64
          path: tools/ffmpeg-build/dist/*
          if-no-files-found: error
          retention-days: 30
